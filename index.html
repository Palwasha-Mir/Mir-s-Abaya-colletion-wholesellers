<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mir's Abaya Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #fff; color: #333; font-family: 'Segoe UI', sans-serif; }
        h1, h2, h3, .brand-title { font-family: 'Playfair Display', serif; }
        
        header { background-color: #111a14; color: #fff; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 3px solid #d4af37; }
        header img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #d4af37; }
        
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('image_68d0c7_2.jpg');
            background-size: cover; background-position: center; height: 50vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; color: #fff; padding: 20px;
        }
        .hero h1 { font-size: 2.5rem; color: #d4af37; }
        
        .container { padding: 40px 20px; max-width: 1000px; margin: auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        
        .card { border: 1px solid #ddd; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-body { padding: 20px; text-align: center; }
        .card-body h3 { font-size: 1.4rem; margin-bottom: 8px; }
        .order-btn { display: block; background: #d4af37; color: white; padding: 12px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <a href="Gemini_Generated_Image_us6kqtus6kqtus6k.jfif" data-lightbox="logo">
            <img src="Gemini_Generated_Image_us6kqtus6kqtus6k.jfif" alt="Logo">
        </a>
        <h3 class="brand-title">Mir's Abaya Boutique</h3>
    </header>

    <section class="hero">
        <h1>Wholesale Collection</h1>
        <p>Premium B2B International Quality Abayas</p>
    </section>

    <div class="container">
        <div class="gallery-grid">
            <!-- Items Data -->
            <script>
                const items = [
                    {img: "1.jpeg", title: "Embroidered Green", price: "$22"},
                    {img: "2.jfif", title: "Grey Star Detailed", price: "$26"},
                    {img: "4.jfif", title: "Classic Maroon Pleated", price: "$29"},
                    {img: "5.jfif", title: "Floral Embroidered Wrap", price: "$33"},
                    {img: "7.jfif", title: "Purple Cutwork Sleeve", price: "$25"},
                    {img: "8.jfif", title: "Royal Green Kaftan", price: "$36"},
                    {img: "9.jfif", title: "Muted Pink Buttoned", price: "$24"},
                    {img: "24.jpeg", title: "Beaded Charcoal Grey", price: "$30"},
                    {img: "25.jpeg", title: "Beige Open Front", price: "$23"},
                    {img: "26.jpeg", title: "Minimalist Cream Closed", price: "$20"}
                ];
                items.forEach(item => {
                    document.write(`
                        <div class="card">
                            <a href="${item.img}" data-lightbox="gallery" data-title="${item.title} - ${item.price}">
                                <img src="${item.img}" alt="${item.title}">
                            </a>
                            <div class="card-body">
                                <h3>${item.title}</h3>
                                <p>Price: <b>${item.price}</b> | Size: <b>S-XL</b></p>
                                <a href="https://wa.me/923348147509" class="order-btn">Order</a>
                            </div>
                        </div>
                    `);
                });
            </script>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
</body>
</html>
