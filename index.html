<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mir's Abaya Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #fff; color: #333; font-family: 'Segoe UI', sans-serif; }
        
        /* Font Styles */
        h1, h2, h3, .brand-title { font-family: 'Playfair Display', serif; }
        
        header { background-color: #111a14; color: #fff; padding: 20px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #d4af37; }
        .logo-box { display: flex; align-items: center; gap: 15px; }
        
        /* Logo click setup */
        .logo-click { cursor: pointer; }
        .logo-box img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #d4af37; }
        
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('image_68d0c7_2.jpg');
            background-size: cover; background-position: center; height: 50vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; color: #fff; padding: 20px;
        }
        .hero h1 { font-size: 2.5rem; color: #d4af37; margin-bottom: 10px; }

        .container { padding: 40px 20px; max-width: 1000px; margin: auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        
        .card { border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card a img { width: 100%; height: 300px; object-fit: cover; display: block; }
        .card-body { padding: 20px; text-align: center; }
        .card-body h3 { font-size: 1.4rem; color: #111a14; margin-bottom: 10px; }
        .card-body p { margin-bottom: 15px; font-size: 1.1rem; }
        .order-btn { display: block; background: #d4af37; color: white; padding: 12px; text-decoration: none; border-radius: 6px; font-weight: bold; font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <!-- Logo with Lightbox -->
            <a href="Gemini_Generated_Image_us6kqtus6kqtus6k.jfif" data-lightbox="logo" class="logo-click">
                <img src="Gemini_Generated_Image_us6kqtus6kqtus6k.jfif" alt="Logo">
            </a>
            <h3 class="brand-title">Mir's Abaya Boutique</h3>
        </div>
    </header>

    <section class="hero">
        <h1>Wholesale Collection</h1>
        <p>Premium B2B International Quality Abayas</p>
    </section>

    <div class="container">
        <div class="gallery-grid">
            <!-- Abaya Item (Copy this block for more) -->
            <div class="card">
                <a href="1.jpeg" data-lightbox="gallery" data-title="Embroidered Green Abaya - $22">
                    <img src="1.jpeg" alt="Abaya">
                </a>
                <div class="card-body">
                    <h3>Embroidered Green</h3>
                    <p>Price: <b>$22</b> | Size: <b>S-XL</b></p>
                    <a href="https://wa.me/923348147509" class="order-btn">Order Now</a>
                </div>
            </div>
            <!-- Add more cards here like the one above -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
</body>
</html>
