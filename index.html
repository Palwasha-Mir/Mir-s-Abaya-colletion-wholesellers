<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation Bar -->

            <img src="logo.png" alt="Mir's Abaya Boutique Logo">
            <span class="brand-title">Mir's Abaya Boutique</span>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#collection">Collection</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#contact">Contact</a></li>

        </nav>

    <section id="home" class="hero-section">
        <div class="hero-content">

        <!-- Abaya picture cards will go here -->

    <footer>
        <p>&copy; 2026 Mir's Abaya Boutique. All Rights Reserved. Designed for Premium Modest Fashion.</p>
